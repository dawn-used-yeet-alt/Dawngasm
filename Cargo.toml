[package]
name = "dawngasm-tui"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Dawngasm TUI: browse and play audio posts from the dawngasm index in a terminal."
publish = false

[lib]
name = "dawngasm_tui"
path = "src/lib.rs"

[[bin]]
name = "dawngasm-tui"
path = "src/main.rs"

# The webview is a plugin, not part of the TUI: only this helper links the
# platform webview. A headless build skips it entirely.
[[bin]]
name = "dawngasm-plugin-clearance"
path = "src/bin/clearance.rs"
required-features = ["webview"]

[features]
default = ["webview"]
# Builds the bundled Cloudflare clearance plugin. The TUI itself never links
# WebKitGTK, WKWebView or WebView2, so it starts without them; `C` needs the
# plugin and its runtime. `--no-default-features` skips building the plugin,
# while still allowing a separately installed one.
webview = ["dep:wry", "dep:tao"]

[dependencies]
# Terminal UI + its crossterm backend (re-exported as `ratatui::crossterm`).
ratatui = "0.30"

# Audio output only. rodio's own decoders are deliberately off: it pins
# symphonia 0.5, which cannot read hotaudio's fragmented MP4. We decode with
# symphonia 0.6 below and hand rodio a `Source` of our own.
rodio = { version = "0.23", default-features = false, features = ["playback"] }

# Decoding. `isomp4` + `aac` cover soundgasm/audiochan/hotaudio (m4a / fMP4),
# `mp3`/`flac` cover whyp. `opt-simd` keeps the hot loops on AES/SHA paths.
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "isomp4",
    "mp3",
    "flac",
    "opt-simd",
] }

# HTTP (the dawngasm API plus the audio hosts). `cookies` is load-bearing for
# audiochan: the play-intent cookie has to ride the ranged stream requests too.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "cookies"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
# Early error reporting + a decent backtrace without hand-rolling it.
thiserror = "2"

# The hotaudio protocol client, at the latest release (v2.1.2). v2 adds the
# Cloudflare clearance pair (`Client::with_cookie` + `Client::with_user_agent`)
# and reports challenge pages as `Error::Challenge`. The CLI feature is off: the
# library is the only part this app uses.
hotaudio = { package = "hotaudio-rs", git = "https://github.com/dawn-used-yeet-alt/hotaudio-extractor.git", rev = "3cccd2c9f127527e67bf5571134e88a735a86ef4", default-features = false }

# System webview for the bundled clearance plugin. `wry` renders with the
# platform's own webview (WebKitGTK on Linux, WKWebView on macOS, WebView2 on
# Windows); `tao` supplies the window and event loop around it. Only
# `dawngasm-plugin-clearance` uses these, so the TUI binary does not link them.
wry = { version = "0.57", optional = true }
tao = { version = "0.37", default-features = false, features = ["rwh_06"], optional = true }

# MPRIS over D-Bus for media keys and desktop panels. async-io gives zbus'
# async object server an executor to run on. D-Bus integration is Linux-only;
# the stub module keeps the app's interface identical elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6"
async-io = "2"

[dev-dependencies]

# Lint policy: deny the default, pedantic and nursery lint groups. Targeted
# `#[allow(...)]` attributes at the call site document any exception.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
