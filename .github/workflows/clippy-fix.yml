name: Clippy autofix (temporary)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    if: github.head_ref == 'strict-clippy' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply machine-applicable Clippy fixes
        run: cargo clippy --fix --allow-dirty --allow-staged --all-targets || true
      - name: Show remaining warnings
        if: always()
        run: cargo clippy --all-targets 2>&1 | tail -200 || true
      - name: Create patch
        if: always()
        run: git diff > clippy-fixes.patch && wc -l clippy-fixes.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-fixes
          path: clippy-fixes.patch
